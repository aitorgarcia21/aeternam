# Chaque envoi sur main reconstruit le site dans toutes les langues et le publie
# sur Cloudflare Pages (æternam.com). Les calculs sont refaits en parallèle,
# dans un job séparé, pour ne pas retarder la publication (le site lit les
# resultats.json versionnés).
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Seule la publication la plus récente compte : un nouvel envoi annule l'ancienne.
    concurrency:
      group: deploiement
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 51f4f2022866691a8463daeb654d4afc
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les modèles de relativité et les scènes
        run: node --test site/tests/*.test.mjs

      - name: Construire le site (vérifie chaque traduction)
        run: python3 site/generer.py

      - name: Publier sur Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy public --project-name aeternam --branch main --commit-dirty=true

      - name: Signaler l'absence de jeton Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: 'echo "::warning::Secret CLOUDFLARE_API_TOKEN absent, site construit mais non publié."'

  # Les calculs de contrôle vont toujours au bout, même si un envoi plus récent arrive.
  calculs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/deployer.yml

      - name: Installer numpy
        run: pip install 'numpy>=2,<3'

      - name: Refaire les calculs et leurs autotests
        run: |
          for script in recherche/*/analyse.py; do
            python3 "$script" --out "$RUNNER_TEMP/resultats.json" > /dev/null
          done
